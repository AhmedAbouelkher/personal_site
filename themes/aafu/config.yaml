baseURL: /
locale: en-us
build:
  writeStats: true
title: aafu theme
# Uncomment below to use aafu as hugo theme. See instructions in README.md
# theme: aafu

params:
  author: Darshan Baral
  description: Website title
  copyright: powered by [hugo](https://gohugo.io/)
  theme:
    mainTheme: dark
    showAttribute: true
    singlePage: false
  accordion:
    - item: about_me
      expand: true # all sections expand by default; set `expand: false` to collapse
    - item: experiences
    - item: education
    - item: publications
    - item: projects
    - item: skills
      panel_id: skill-panel
    - item: hobbies

# Allow Hugo to run the Tailwind CSS v4 CLI used by `css.TailwindCSS`
security:
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$
